<style>
:root{
  color-scheme:light;
  --bg:#F1F2F7; --surface:#FFFFFF; --surface-2:#E8EAF2; --ink:#131A38; --ink-2:#464D6E; --muted:#73789A; --line:#D8DBE7;
  --accent:#C9581A; --accent-ink:#FFFFFF; --accent-soft:#FBE4D3;
  --t1:#C9581A; --t1-soft:#FBE4D3; --t2:#2672B3; --t2-soft:#DCEBF8; --t3:#97680D; --t3-soft:#F5EAD0;
  --night:#0B1028; --night-2:#141B3D; --dusk:#F28C3A;
  --bar:rgba(241,242,247,.88);
  --display:"Oswald","Noto Sans SC","PingFang SC",sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tcol:108px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A0F26; --surface:#121939; --surface-2:#1A2248; --ink:#ECEEF8; --ink-2:#B3B8D3; --muted:#8389A8; --line:#262F57;
    --accent:#F59A4A; --accent-ink:#1A0E05; --accent-soft:rgba(245,154,74,.16);
    --t1:#F59A4A; --t1-soft:rgba(245,154,74,.15); --t2:#62B4F0; --t2-soft:rgba(98,180,240,.15); --t3:#E5B85C; --t3-soft:rgba(229,184,92,.15);
    --bar:rgba(10,15,38,.86);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A0F26; --surface:#121939; --surface-2:#1A2248; --ink:#ECEEF8; --ink-2:#B3B8D3; --muted:#8389A8; --line:#262F57;
  --accent:#F59A4A; --accent-ink:#1A0E05; --accent-soft:rgba(245,154,74,.16);
  --t1:#F59A4A; --t1-soft:rgba(245,154,74,.15); --t2:#62B4F0; --t2-soft:rgba(98,180,240,.15); --t3:#E5B85C; --t3-soft:rgba(229,184,92,.15);
  --bar:rgba(10,15,38,.86);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

/* hero */
.hero{background:var(--night);display:flex;justify-content:center}
.hero img{display:block;width:100%;max-width:1600px;aspect-ratio:1600/620;object-fit:cover;object-position:50% 46%}
.intro{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 40px;padding-block:28px 22px}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font:600 clamp(34px,5vw,54px)/1.05 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--ink-2);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;margin:0}
.facts div{display:flex;align-items:baseline;gap:7px}
.facts dt{font:500 30px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.facts dd{margin:0;color:var(--muted);font-size:13px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-block:1px solid var(--line)}
.bar-in{display:flex;flex-direction:column;gap:10px;padding-block:10px}
.row-a,.row-b{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.days{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.day-btn{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left;flex:1 1 0;min-width:0}
.day-btn .d{font:500 22px/1 var(--display);font-variant-numeric:tabular-nums}
.day-btn .n{font-size:12.5px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-btn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day-btn[aria-selected="true"] .n{color:inherit;opacity:.75}
.tools{display:flex;gap:6px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.icon-btn svg{width:16px;height:16px}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.icon-btn[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent)}
.lang{font-weight:600;min-width:52px;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:2px;background:var(--c,var(--ink-2))}
.chip[aria-pressed="true"]{background:var(--surface);border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1px var(--c,var(--ink))}
.day{scroll-margin-top:calc(var(--barh,120px) + 16px);margin-bottom:64px}
.day-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-bottom:12px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.day-h .dd{font:600 clamp(36px,5vw,48px)/1 var(--display);font-variant-numeric:tabular-nums}
.day-h .dn{font:500 19px/1.2 var(--display);color:var(--ink-2);letter-spacing:.01em}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 12px 0 34px;font:inherit;font-size:14px}
.search svg{position:absolute;left:11px;top:10px;width:16px;height:16px;stroke:var(--muted);fill:none}

/* schedule */
main{padding-block:26px 40px}
.block{margin-block:0 36px}
.block-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 12px}
.block-h h2{font:600 24px/1.2 var(--display);margin:0;letter-spacing:.01em}
.block-h p{margin:0;color:var(--muted);font-size:13.5px}
.time{font:600 14px/1.4 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.p-list{border-top:1px solid var(--line)}
.p-row{display:grid;grid-template-columns:var(--tcol) 1fr;gap:18px;padding-block:14px;border-bottom:1px solid var(--line)}
.p-row>.time{white-space:nowrap}
.p-row.ev .ttl{font-weight:600}
.p-row.brk{padding-block:9px}
.p-row.brk .time,.p-row.brk .ttl{color:var(--muted);font-weight:400;font-size:13.5px}
.p-row.has-talk .time{color:var(--accent);font-size:14px;white-space:nowrap}
.p-row .talk{background:none;border:0;padding:0}
.p-row .talk-title{font-size:21px}
.p-row .av{width:56px;height:56px}
.p-row .talk .abs{max-width:72ch}

.aside{display:grid;grid-template-columns:var(--tcol) 1fr;gap:18px;padding:12px 0;margin-bottom:14px;border:1px dashed var(--line);border-radius:10px;padding-inline:14px}
.aside .k{font:600 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.aside b{display:block}
.aside span{color:var(--ink-2);font-size:13.5px}

.grid{--n:3}
.g-head,.g-row{display:grid;grid-template-columns:var(--tcol) repeat(var(--n),minmax(0,1fr));gap:12px}
.g-head{padding-bottom:10px;border-bottom:1px solid var(--line)}
.g-head .th{display:flex;flex-direction:column;gap:1px;padding-left:2px}
.g-head .th b{font:600 13px/1.3 var(--mono);color:var(--c)}
.g-head .th span{font:500 18px/1.2 var(--display);letter-spacing:.01em}
.g-row{padding-block:12px;border-bottom:1px solid var(--line);align-items:stretch}
.g-row>.time{padding-top:14px}
.g-row.brk{padding-block:8px}
.g-row.brk .time,.g-row.brk .lbl{color:var(--muted);font-size:13.5px;font-weight:400;padding-top:0}
.g-row.brk .lbl{grid-column:2/-1}
.cell{display:flex;flex-direction:column;gap:10px;min-width:0}
.cell.cont{justify-content:center;align-items:flex-start;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}

.talk{position:relative;display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px 12px;min-width:0;height:100%}
.talk.is-now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-right:30px;min-height:22px}
.trk{font:600 11px/1 var(--mono);padding:5px 7px;border-radius:4px;background:var(--cs);color:var(--c);letter-spacing:.02em}
.tag{font:600 11px/1 var(--mono);padding:5px 7px;border-radius:4px;background:var(--ink);color:var(--bg);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;gap:4px;align-items:center}
.tag svg{width:11px;height:11px;fill:currentColor}
.meta .tm{font:500 12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.now{display:none;font:600 11px/1 var(--mono);padding:5px 7px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.is-now .now{display:inline-block}
.star{position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--muted)}
.star svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.star:hover{background:var(--surface-2)}
.star[aria-pressed="true"]{color:var(--accent)}
.star[aria-pressed="true"] svg{fill:var(--accent)}
.talk-title{font:600 16.5px/1.38 var(--body);margin:0;text-wrap:pretty;letter-spacing:-.005em}
.spks{display:flex;flex-direction:column;gap:8px}
.spk{display:flex;gap:10px;align-items:center;min-width:0}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2)}
.spk b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.spk small{display:block;overflow-wrap:anywhere;color:var(--muted);font-size:12.5px;line-height:1.4}
.host{font-size:13px;color:var(--ink-2)}
details{margin-top:auto}
summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:4px;user-select:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:3px}
details[open] summary::before{transform:rotate(45deg)}
.abs{margin:8px 0 0;font-size:14px;color:var(--ink-2);line-height:1.7}
.bio{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.6;padding-top:8px;border-top:1px solid var(--line)}
.bio b{color:var(--ink-2);font-weight:600}

.lset{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--t2-soft);height:100%}
.lset-h{display:flex;align-items:center;gap:6px;font:600 12px/1.2 var(--mono);color:var(--t2);text-transform:uppercase;letter-spacing:.06em;padding:2px 2px 0}
.lset-h svg{width:13px;height:13px;fill:currentColor}
.lset .talk{height:auto;padding:10px 12px}
.lset .talk-title{font-size:14.5px}
.lset .av{width:32px;height:32px}

[data-track="T1"]{--c:var(--t1);--cs:var(--t1-soft)}
[data-track="T2"]{--c:var(--t2);--cs:var(--t2-soft)}
[data-track="T3"]{--c:var(--t3);--cs:var(--t3-soft)}

/* day 0 */
.venues{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.venue{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 8px}
.venue h3{font:600 22px/1.2 var(--display);margin:0;letter-spacing:.01em}
.venue .addr{margin:4px 0 0;color:var(--muted);font-size:13px}
.venue .addr a{color:inherit}
.sec{margin-top:18px}
.sec h4{margin:0 0 4px;font-size:15px;font-weight:600}
.sec .sub{margin:0 0 8px;color:var(--muted);font-size:13px}
.sec .p-list{border-top:1px solid var(--line)}
.venue .p-row{grid-template-columns:96px 1fr;gap:14px;padding-block:10px}
.venue .p-row:last-child{border-bottom:0}
.ws{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);margin-right:6px;vertical-align:2px}
.desc{display:block;color:var(--ink-2);font-size:13.5px;margin-top:3px;font-weight:400}
.ct{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:400}
.ct li{padding-left:14px;position:relative;color:var(--ink-2)}
.ct li::before{content:"";position:absolute;left:2px;top:.65em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.ct li b{color:var(--ink)}
.note{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px;color:var(--ink)}

.empty{padding:40px 0;text-align:center;color:var(--muted)}
.empty .others{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}

/* venue footer */
.foot{border-top:1px solid var(--line);padding-block:28px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.foot h3{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px}
.foot p{margin:0;font-size:14px;color:var(--ink-2)}
.foot p b{color:var(--ink);display:block;font-size:15px}
.foot a{color:var(--accent)}

@media (max-width: 900px){
  :root{--tcol:100px}
  .g-head{display:none}
  .g-row{display:flex;flex-direction:column;gap:10px}
  .g-row>.time{padding-top:0;color:var(--accent);font-size:15px}
  .g-row.brk{flex-direction:row;gap:12px}
  .cell:empty{display:none}
  .talk{height:auto}
  .lset{height:auto}
  .venues{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr}
}
@media (max-width: 560px){
  .bar-in{flex-direction:row;flex-wrap:wrap;gap:8px;padding-block:8px}
  .row-a,.row-b{display:contents}
  .days{order:1;flex-basis:100%}
  .tools{order:2;flex:none}
  .search{order:3;flex:1 1 120px}
  .chips{order:4;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
  .chips::-webkit-scrollbar{display:none}
  .icon-btn{padding:0 10px}
  .day-btn .n{white-space:normal}
  .day-btn{flex-direction:column;gap:3px;padding:7px 9px}
  .day-btn .d{font-size:19px}
  .p-row,.aside{grid-template-columns:1fr;gap:4px}
  .venue .p-row{grid-template-columns:1fr;gap:2px}
  .p-row .talk-title{font-size:18px}
  .hero img{aspect-ratio:16/9;object-position:28% 50%}
  .tools .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

      </div>

      <div class="chips" id="chips"></div>

  noStars:{zh:'还没有收藏。点击议题卡片右上角的星标即可加入「我的收藏」，收藏只保存在本机浏览器。',en:'Nothing saved yet. Tap the star on any talk to add it to My picks. Picks are stored in this browser only.'},

const TAGS={keynote:{zh:'主题演讲',en:'Keynote'},demo:{zh:'特别演示',en:'Special Demo'},fireside:{zh:'炉边对话',en:'Fireside Chat'},lightning:{zh:'闪电',en:'Lightning'},panel:{zh:'圆桌讨论',en:'Panel'}};
const TRACKS={
  T1:{zh:'Rust for AI',en:'Rust for AI'},
  T2:{zh:'AI for Rust',en:'AI for Rust'},
  T3:{zh:'Rust in Production',en:'Rust in Production'},
};
const DAYS=[

function goDay(id,smooth=true){
  const sec=document.getElementById('day'+id);if(!sec||sec.hidden)return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  sec.scrollIntoView({behavior:smooth&&!reduce?'smooth':'auto',block:'start'});
  selectDay(id);
  try{history.replaceState(null,'','#day'+id)}catch(_){}
}
function spy(){
  const line=$('.bar').getBoundingClientRect().bottom+40;let cur=null;
  document.querySelectorAll('#main .day').forEach(s=>{if(!s.hidden&&(cur==null||s.getBoundingClientRect().top<=line))cur=+s.dataset.sec});
  if(cur!=null&&cur!==S.day)selectDay(cur);
}
const setBar=()=>document.documentElement.style.setProperty('--barh',$('.bar').offsetHeight+'px');

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.day!=null){goDay(+b.dataset.day);return}
  if(b.dataset.chip){S.track=b.dataset.chip;renderChrome();apply();return}
  if(b.classList.contains('star')){
    const id=b.closest('.talk').dataset.id;
    S.stars.has(id)?S.stars.delete(id):S.stars.add(id);
    store.set('rcc26-stars',[...S.stars]);
    b.setAttribute('aria-pressed',S.stars.has(id));
    $('#starCount').textContent=S.stars.size?`(${S.stars.size})`:'';
    if(S.starOnly)apply();
    return;
  }
  if(b.id==='starOnly'){S.starOnly=!S.starOnly;renderChrome();apply();return}
  if(b.id==='openAll'){S.open=!S.open;b.setAttribute('aria-pressed',S.open);document.querySelectorAll('#main details').forEach(d=>d.open=S.open);return}
  if(b.id==='theme'){S.theme=THEMES[(THEMES.indexOf(S.theme)+1)%THEMES.length];store.set('rcc26-theme',S.theme);applyTheme();renderTheme();return}
  if(b.id==='lang'){S.lang=S.lang==='zh'?'en':'zh';store.set('rcc26-lang',S.lang);render();setBar();return}
});
$('#q').addEventListener('input',e=>{S.q=e.target.value;apply()});
window.addEventListener('hashchange',()=>{const h=location.hash.match(/^#day([012])$/);if(h)goDay(+h[1])});
addEventListener('scroll',()=>requestAnimationFrame(spy),{passive:true});
addEventListener('resize',setBar);
setInterval(()=>document.querySelectorAll('#main .talk').forEach(el=>{const k=BYID[el.dataset.id];el.classList.toggle('is-now',isNow(k.day,k.time))}),60000);
render();setBar();
if(START!=null)requestAnimationFrame(()=>goDay(START,false));
</script>
